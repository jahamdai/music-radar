/* ── Quick Search in Player Topbar ── */
let quickSearchSetup = false;
let qsPhase = 'suggestions';  // 'suggestions' | 'results'
let qsResults = [];

function setupQuickSearch() {
  if (quickSearchSetup) return;
  quickSearchSetup = true;

  const input = document.getElementById('quickSearchInput');
  const dropdown = document.getElementById('quickSearchDropdown');
  if (!input) return;

  let qHighlight = -1;
  let qSuggestions = [];

  /* ── Phase 1: Tag Suggestions ── */
  function showTagSuggestions(query) {
    qsPhase = 'suggestions';
    if (!query) {
      // Show recent tags when focused but empty
      const recent = (JSON.parse(localStorage.getItem('yt_radar_search_history') || '[]'))
        .slice(0, 6).map(h => ({ text: h.text, source: 'history' }));
      const memExtra = memoryBank
        .filter(t => !recent.some(r => r.text.toLowerCase() === t.toLowerCase()))
        .slice(0, 4).map(t => ({ text: t, source: 'memory' }));
      qSuggestions = [...recent, ...memExtra].slice(0, 8);
    } else {
      const lower = query.toLowerCase();
      const fromHistory = (JSON.parse(localStorage.getItem('yt_radar_search_history') || '[]'))
        .filter(h => h.text.toLowerCase().includes(lower) && h.text.toLowerCase() !== lower)
        .slice(0, 6).map(h => ({ text: h.text, source: 'history' }));
      const fromMem = memoryBank.filter(t =>
        t.toLowerCase().includes(lower) && t.toLowerCase() !== lower &&
        !fromHistory.some(h => h.text.toLowerCase() === t.toLowerCase())
      ).slice(0, 4).map(t => ({ text: t, source: 'memory' }));
      qSuggestions = [...fromHistory, ...fromMem].slice(0, 8);
    }
    if (qSuggestions.length === 0) { dropdown.classList.remove('show'); return; }
    qHighlight = -1;
    dropdown.innerHTML = qSuggestions.map((s, i) => `
      <div class="autocomplete-item" data-index="${i}">
        <span>${esc(s.text)}</span>
        <span class="autocomplete-source">${s.source === 'history' ? '歷史' : '記憶'}</span>
      </div>
    `).join('');
    dropdown.classList.add('show');
    dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        input.value = qSuggestions[parseInt(el.dataset.index)].text;
        executeQuickSearch(input.value.trim());
      });
    });
  }

  /* ── Input events ── */
  input.addEventListener('input', () => {
    const val = input.value.trim();
    qsPhase = 'suggestions';
    showTagSuggestions(val);
  });

  input.addEventListener('focus', () => {
    if (qsPhase === 'results' && qsResults.length > 0) {
      dropdown.classList.add('show');
    } else {
      showTagSuggestions(input.value.trim());
    }
  });

  input.addEventListener('blur', () => {
    setTimeout(() => {
      if (qsPhase !== 'results') dropdown.classList.remove('show');
      else if (!dropdown.matches(':hover')) dropdown.classList.remove('show');
    }, 200);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (qsPhase === 'results' && qHighlight >= 0 && qsResults[qHighlight]) {
        switchToQuickSearchResult(qHighlight);
        return;
      }
      const val = (qHighlight >= 0 && qSuggestions[qHighlight])
        ? qSuggestions[qHighlight].text
        : input.value.trim();
      if (val) executeQuickSearch(val);
    } else if (e.key === 'Escape') {
      dropdown.classList.remove('show');
      qsPhase = 'suggestions';
      input.value = '';
      input.blur();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      const list = qsPhase === 'results' ? qsResults : qSuggestions;
      if (list.length === 0) return;
      qHighlight = (qHighlight + 1) % list.length;
      updateQHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const list = qsPhase === 'results' ? qsResults : qSuggestions;
      if (list.length === 0) return;
      qHighlight = qHighlight <= 0 ? list.length - 1 : qHighlight - 1;
      updateQHighlight();
    }
  });

  function updateQHighlight() {
    dropdown.querySelectorAll('.autocomplete-item').forEach((el, i) => {
      el.classList.toggle('highlight', i === qHighlight);
    });
    // Scroll highlighted item into view
    const highlighted = dropdown.querySelector('.highlight');
    if (highlighted) highlighted.scrollIntoView({ block: 'nearest' });
  }
}

/* ── Phase 2: Show search results in dropdown ── */
function showSearchResults(items) {
  const dropdown = document.getElementById('quickSearchDropdown');
  qsPhase = 'results';
  qsResults = items;
  dropdown.innerHTML =
    `<div class="qs-results-header">// ${items.length} 首 · 點選立即換台</div>` +
    items.map((item, i) => {
      const thumb = item.snippet.thumbnails?.default?.url || '';
      return `
        <div class="qs-result-item autocomplete-item" data-index="${i}">
          ${thumb ? `<img class="qs-thumb" src="${thumb}" alt="" loading="lazy">` : '<div class="qs-thumb-ph"></div>'}
          <div class="qs-info">
            <div class="qs-title">${esc(item.snippet.title)}</div>
            <div class="qs-ch">${esc(item.snippet.channelTitle || '')}</div>
          </div>
        </div>
      `;
    }).join('');
  dropdown.classList.add('show');
  dropdown.querySelectorAll('.qs-result-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      switchToQuickSearchResult(parseInt(el.dataset.index));
    });
  });
}

/* ── Execute Quick Search: fetch results then show dropdown ── */
async function executeQuickSearch(tag) {
  if (!tag) return;
  const input = document.getElementById('quickSearchInput');
  const dropdown = document.getElementById('quickSearchDropdown');
  // Set global apiKey so loadMoreVideos works after switching
  apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('yt_radar_key');
  searchOrder = document.getElementById('orderType')?.value || 'relevance';
  if (!apiKey) {
    showToast('請先填入 API Key');
    return;
  }

  // Remember the tag for after input is cleared
  input.dataset.lastTag = tag;
  dropdown.innerHTML = '<div class="qs-results-header"><span class="loading-dot">搜尋中</span></div>';
  dropdown.classList.add('show');
  qsPhase = 'results';

  try {
    const params = new URLSearchParams({
      part: 'snippet', q: tag + ' music',
      type: 'video', order: 'relevance',
      maxResults: 15, videoCategoryId: '10',
      videoEmbeddable: 'true', key: apiKey
    });
    const res = await fetch('https://www.googleapis.com/youtube/v3/search?' + params);
    const data = await res.json();

    if (data.error || !data.items?.length) {
      dropdown.innerHTML = '<div class="qs-results-header">// 找不到結果</div>';
      return;
    }

    const items = filterMusicItems(data.items);
    if (items.length === 0) {
      dropdown.innerHTML = '<div class="qs-results-header">// 結果都被過濾掉了</div>';
      return;
    }

    // Save to search history
    saveMemory(tag);
    addToSearchHistory(tag);

    showSearchResults(items);
  } catch(e) {
    dropdown.innerHTML = `<div class="qs-results-header">// 錯誤：${esc(e.message)}</div>`;
  }
}

/* ── Switch to result: replace entire queue (換台) ── */
function switchToQuickSearchResult(index) {
  const item = qsResults[index];
  if (!item) return;

  const input = document.getElementById('quickSearchInput');
  const dropdown = document.getElementById('quickSearchDropdown');

  // Close dropdown, clear input
  dropdown.classList.remove('show');
  qsPhase = 'suggestions';
  input.value = '';

  // Update search tag
  const tag = input.dataset.lastTag || activeTags[0] || '';
  activeTags = [tag];
  renderActiveTags();
  renderMemory();

  // Replace entire queue with search results starting from selected
  const reordered = [
    ...qsResults.slice(index),
    ...qsResults.slice(0, index)
  ];

  queue = reordered;
  playedIds = new Set();
  nextPageToken = null;
  discoverPhase = 0;
  currentIndex = 0;

  renderSidebar();
  loadVideo(0);
  showToast(`已換台：${item.snippet.title.slice(0, 30)}...`);
}

function loadVideo(index) {
  if (index < 0 || index >= queue.length) return;
  const item = queue[index];
  currentIndex = index;
  playedIds.add(item.id.videoId);

  // Update desktop now-playing
  document.getElementById('nowPlayingTitle').textContent = item.snippet.title;

  // Update mobile now-playing strip
  const mobileTitle = document.getElementById('mobileNpTitle');
  const mobileCh = document.getElementById('mobileNpCh');
  if (mobileTitle) mobileTitle.textContent = decodeHTML(item.snippet.title);
  if (mobileCh) mobileCh.textContent = item.snippet.channelTitle || '';

  playVideoById(item.id.videoId);
  updateSidebarActive();

  const el = document.getElementById(`sid-${index}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Sync mobile playlist if open
  updateMobileSidebarActive();
  updateMobileInlineActive();
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = queue.map((item, i) => sidebarItemHTML(item, i)).join('');
  ensureSidebarFooter();
  setupScrollSentinel();
  syncMobilePlaylist();
  syncMobileInlineList();
}

function ensureSidebarFooter() {
  const list = document.getElementById('sidebarList');

  // Remove old footer if present
  list.querySelectorAll('.scroll-sentinel, .explore-more-btn, .load-more-btn, .list-end-msg').forEach(el => el.remove());

  // Don't add footer if loop mode is on (we don't want to load more)
  if (loopMode === 'all' || loopMode === 'one') return;

  // Manual "Load More" button — same query, next page
  const loadMoreBtn = document.createElement('button');
  loadMoreBtn.className = 'load-more-btn';
  loadMoreBtn.id = 'loadMoreBtn';
  loadMoreBtn.textContent = '▼ 載入更多';
  loadMoreBtn.title = '繼續抓同 tag 的下一批音樂（消耗 1 次配額）';
  loadMoreBtn.addEventListener('click', manualLoadMore);
  list.appendChild(loadMoreBtn);

  // Manual "Explore New Style" button — jumps to discovery phase
  const exploreBtn = document.createElement('button');
  exploreBtn.className = 'explore-more-btn';
  exploreBtn.id = 'exploreMoreBtn';
  exploreBtn.textContent = '+ 探索新風格';
  exploreBtn.title = '跳到下一個探索階段，發現相關但不同的音樂';
  exploreBtn.addEventListener('click', manualExplore);
  list.appendChild(exploreBtn);
}

function sidebarItemHTML(item, i) {
  const thumb = item.snippet.thumbnails?.default?.url || '';
  const title = esc(item.snippet.title);
  const channel = esc(item.snippet.channelTitle || '');
  const isPlayed = playedIds.has(item.id.videoId) && i !== currentIndex;
  return `
    <div class="sidebar-item ${i === currentIndex ? 'active' : ''} ${isPlayed ? 'played' : ''}" id="sid-${i}" onclick="loadVideo(${i})">
      ${thumb ? `<img class="sidebar-thumb" src="${thumb}" alt="" loading="lazy">` : `<div class="sidebar-thumb" style="display:flex;align-items:center;justify-content:center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5"><polygon points="5,3 19,12 5,21"/></svg></div>`}
      <div class="sidebar-info" style="padding-right:24px;">
        <div class="sidebar-title-text">${title}</div>
        <div class="sidebar-ch">${channel}</div>
      </div>
      <button class="sid-menu-btn" onclick="openSidebarMenu(event, ${i})" title="更多選項">⋯</button>
    </div>
  `;
}

function appendSidebarItems(newItems, startIdx) {
  const list = document.getElementById('sidebarList');
  // Remove footer elements before appending new items
  list.querySelectorAll('.loading-more, .scroll-sentinel, .explore-more-btn, .list-end-msg').forEach(el => el.remove());
  newItems.forEach((item, i) => {
    list.insertAdjacentHTML('beforeend', sidebarItemHTML(item, startIdx + i));
  });
  ensureSidebarFooter();
  setupScrollSentinel();
}

function updateSidebarActive() {
  document.querySelectorAll('.sidebar-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIndex);
    el.classList.toggle('played', playedIds.has(queue[i]?.id?.videoId) && i !== currentIndex);
  });
}

function showSidebarLoading(show) {
  const list = document.getElementById('sidebarList');
  let el = list.querySelector('.loading-more');
  if (show && !el) {
    // Insert before any sentinel/explore-btn so it appears between items and footer
    const footer = list.querySelector('.scroll-sentinel, .explore-more-btn, .list-end-msg');
    const html = `<div class="loading-more"><span class="loading-dot">載入更多</span></div>`;
    if (footer) {
      footer.insertAdjacentHTML('beforebegin', html);
    } else {
      list.insertAdjacentHTML('beforeend', html);
    }
  } else if (!show && el) {
    el.remove();
  }
}

/* ── Manual Load More (no auto-trigger) ── */
function setupScrollSentinel() {
  // Disabled: now using manual buttons only
  if (scrollObserver) {
    scrollObserver.disconnect();
    scrollObserver = null;
  }
}

async function manualLoadMore() {
  if (isFetching) return;
  const btn = document.getElementById('loadMoreBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '載入中...';
  }
  showSidebarLoading(true);
  const loaded = await loadMoreVideos();
  showSidebarLoading(false);
  if (btn) {
    btn.disabled = false;
    btn.textContent = '▼ 載入更多';
  }
  if (!loaded) {
    showStatus('暫時找不到更多結果', 'info');
  }
}

async function manualExplore() {
  if (isFetching) return;

  const btn = document.getElementById('exploreMoreBtn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '探索中...';
  }

  // Force jump to next discovery phase
  discoverPhase = Math.max(2, discoverPhase + 1);
  nextPageToken = null;  // skip pagination, go straight to related discovery

  showSidebarLoading(true);
  const loaded = await loadMoreVideos();
  showSidebarLoading(false);

  if (btn) {
    btn.disabled = false;
    btn.textContent = '+ 探索新風格';
  }

  if (!loaded) {
    showStatus('暫時找不到更多相關內容', 'info');
  }
}

/* ══ CONTROLS ══ */
function toggleAutoplay() {
  autoplay = !autoplay;
  const btn = document.getElementById('autoplayBtn');
  const badge = document.getElementById('modeBadge');
  btn.classList.toggle('on', autoplay);
  badge.classList.toggle('dim', !autoplay);
}

/* Loop cycles: off → all → one → off */
function toggleLoop() {
  if (loopMode === 'off') loopMode = 'all';
  else if (loopMode === 'all') loopMode = 'one';
  else loopMode = 'off';

  const btn = document.getElementById('loopBtn');
  const badge = document.getElementById('loopBadge');

  if (loopMode === 'off') {
    btn.textContent = '↻ 關';
    btn.classList.remove('on');
    badge.classList.add('dim');
    badge.textContent = 'LOOP';
  } else if (loopMode === 'all') {
    btn.textContent = '↻ 全部';
    btn.classList.add('on');
    badge.classList.remove('dim');
    badge.textContent = 'LOOP ALL';
  } else {
    btn.textContent = '↻ 單曲';
    btn.classList.add('on');
    badge.classList.remove('dim');
    badge.textContent = 'LOOP 1';
  }

  // Refresh sidebar footer (hide load-more when looping)
  ensureSidebarFooter();
  setupScrollSentinel();
}

function toggleShuffle() {
  shuffle = !shuffle;
  const btn = document.getElementById('shuffleBtn');
  const badge = document.getElementById('shuffleBadge');
  btn.classList.toggle('on', shuffle);
  badge.classList.toggle('dim', !shuffle);

  if (shuffle) {
    // Shuffle remaining unplayed items from currentIndex+1 onward
    const played = queue.slice(0, currentIndex + 1);
    const remaining = queue.slice(currentIndex + 1);
    shuffleArray(remaining);
    queue = [...played, ...remaining];
    renderSidebar();
    updateSidebarActive();
  }
}

/* ══ UTILS ══ */
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function showStatus(html, type) {
  const el = document.getElementById('status');
  el.style.display = 'block'; el.className = type; el.innerHTML = html;
}

function decodeHTML(str) {
  // Decode HTML entities that YouTube API sometimes pre-encodes in titles
  const txt = document.createElement('textarea');
  txt.innerHTML = str;
  return txt.value;
}

function esc(str) {
  // First decode any pre-encoded HTML entities (e.g. &#39; → ')
  // then re-encode only the dangerous characters for safe innerHTML insertion
  return String(decodeHTML(str))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// For use inside HTML attribute values that use single quotes
function escAttr(str) {
  return String(decodeHTML(str))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement.id !== 'tagInput') startSearch();
});

/* ══ TAG-BASED RECOMMENDATIONS ══ */
const REC_CACHE_KEY = 'yt_radar_rec_cache';
const REC_DATE_KEY = 'yt_radar_rec_date';
const REC_COUNT = 8;

function getTodayDateString() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function loadRecommendations() {
  // Check if we have memoryBank
  const memory = JSON.parse(localStorage.getItem('yt_radar_memory') || '[]');
  if (memory.length === 0) return;  // No history, no recommendations

  // Try cached first
  const cached = JSON.parse(localStorage.getItem(REC_CACHE_KEY) || 'null');
  const cachedDate = localStorage.getItem(REC_DATE_KEY);
  const today = getTodayDateString();

  if (cached && cachedDate === today && cached.length > 0) {
    // Use cache
    renderRecommendations(cached, true);
    return;
  }

  // No cache or expired — generate new (only if API key available)
  const apiKey = (document.getElementById('apiKey').value || localStorage.getItem('yt_radar_key') || '').trim();
  if (!apiKey) {
    // No API key yet — show placeholder
    return;
  }

  generateRecommendations(apiKey, memory);
}

async function generateRecommendations(apiKey, memory, isManualShuffle) {
  // Pick up to 8 random tags from memory
  const tagsPool = [...memory];
  shuffleArray(tagsPool);
  const selectedTags = tagsPool.slice(0, REC_COUNT);

  // Show loading state
  document.getElementById('recommendationsSection').style.display = 'block';
  document.getElementById('recTagDisplay').textContent = `${selectedTags.length} 種風格`;
  showRecLoading(selectedTags.length);
  document.getElementById('recShuffleBtn').disabled = true;

  // Fetch one video per tag (parallel)
  const fetches = selectedTags.map(tag => fetchOneRecVideo(apiKey, tag));
  const results = await Promise.allSettled(fetches);

  const recs = [];
  results.forEach((r, i) => {
    if (r.status === 'fulfilled' && r.value) {
      recs.push({ ...r.value, tag: selectedTags[i] });
    }
  });

  document.getElementById('recShuffleBtn').disabled = false;

  if (recs.length === 0) {
    document.getElementById('recommendationsSection').style.display = 'none';
    return;
  }

  // Cache today's batch
  localStorage.setItem(REC_CACHE_KEY, JSON.stringify(recs));
  localStorage.setItem(REC_DATE_KEY, getTodayDateString());

  renderRecommendations(recs, false);
}

async function fetchOneRecVideo(apiKey, tag) {
  try {
    const params = new URLSearchParams({
      part: 'snippet',
      q: tag + ' music',
      type: 'video',
      order: 'relevance',
      maxResults: 5,  // get a few options to pick from
      videoCategoryId: '10',
      videoEmbeddable: 'true',
      key: apiKey
    });
    const res = await fetch('https://www.googleapis.com/youtube/v3/search?' + params);
    const data = await res.json();
    if (data.error || !data.items?.length) return null;

    // Apply same filter (skip non-music & blocked)
    const filtered = data.items.filter(item => {
      if (!item.id?.videoId) return false;
      const title = item.snippet?.title || '';
      const channelId = item.snippet?.channelId || '';
      if (blockedVideos.has(item.id.videoId)) return false;
      if (blockedChannels.has(channelId)) return false;
      return !isNonMusicContent(title);
    });

    if (filtered.length === 0) return null;
    // Pick a random one from the top results for variety
    return filtered[Math.floor(Math.random() * filtered.length)];
  } catch {
    return null;
  }
}

function showRecLoading(count) {
  const grid = document.getElementById('recGrid');
  grid.innerHTML = Array.from({length: count}, () =>
    '<div class="rec-loading-card"></div>'
  ).join('');
  document.getElementById('recMeta').textContent = '// 載入中...';
}

function renderRecommendations(recs, fromCache) {
  const grid = document.getElementById('recGrid');
  const section = document.getElementById('recommendationsSection');
  const meta = document.getElementById('recMeta');
  const tagDisplay = document.getElementById('recTagDisplay');

  section.style.display = 'block';
  tagDisplay.textContent = `${recs.length} 種風格`;

  grid.innerHTML = recs.map((r, i) => {
    const thumb = r.snippet.thumbnails?.medium?.url || r.snippet.thumbnails?.default?.url || '';
    const title = esc(r.snippet.title);
    const tag = esc(r.tag || '');
    return `
      <div class="rec-card" onclick="playRecommendation('${r.id.videoId}', ${i})">
        <img class="rec-thumb" src="${thumb}" alt="" loading="lazy" />
        <div class="rec-info">
          <div class="rec-title">${title}</div>
          <span class="rec-tag-chip">#${tag}</span>
        </div>
      </div>
    `;
  }).join('');

  meta.innerHTML = fromCache
    ? '// 今日推薦（每天午夜更新）'
    : '// 剛剛生成';
}

async function shuffleRecommendations() {
  const apiKey = (document.getElementById('apiKey').value || localStorage.getItem('yt_radar_key') || '').trim();
  if (!apiKey) {
    showStatus('請先填入 API Key', 'error');
    return;
  }

  const memory = JSON.parse(localStorage.getItem('yt_radar_memory') || '[]');
  if (memory.length === 0) {
    showStatus('還沒有 tag 紀錄，先搜尋一些音樂吧', 'error');
    return;
  }

  // Force regenerate (overwrites today's cache)
  await generateRecommendations(apiKey, memory, true);
}

/* When user clicks a recommendation, treat it like a single-tag search */
async function playRecommendation(videoId, index) {
  // Get the rec data
  const cached = JSON.parse(localStorage.getItem(REC_CACHE_KEY) || '[]');
  const rec = cached[index];
  if (!rec) return;

  const apiKey = (document.getElementById('apiKey').value || localStorage.getItem('yt_radar_key') || '').trim();
  if (!apiKey) {
    showStatus('請先填入 API Key', 'error');
    return;
  }

  // Set tag and start search
  activeTags = [rec.tag];
  renderActiveTags();

  showStatus('<span class="loading-dot">載入中</span>', 'loading');

  // Run a search using just this tag
  await startSearch();

  // Find the rec video in the queue if present, else add it at front
  const idx = queue.findIndex(item => item.id?.videoId === videoId);
  if (idx >= 0) {
    openPlayer(idx);
  } else {
    // Insert the rec at the start of the queue and play it
    queue.unshift(rec);
    openPlayer(0);
  }
}


(function() {
  const p = new URLSearchParams(location.search);
  const tags = p.get('tags');
  const apiKey = p.get('apiKey');
  const orderType = p.get('orderType');
  const startIndexRaw = p.get('startIndex');

  if (!tags && !apiKey) return;

  // Inject API key
  if (apiKey) {
    document.getElementById('apiKey').value = apiKey;
    localStorage.setItem('yt_radar_key', apiKey);
  }

  // Inject order
  if (orderType) {
    const sel = document.getElementById('orderType');
    if (sel) sel.value = orderType;
  }

  // Inject tags
  if (tags) {
    tags.split(',').filter(Boolean).forEach(t => addActiveTag(t));
  }

  // Only auto-search & auto-play when Popup explicitly passed startIndex
  // (which means user clicked a specific song to play)
  if (tags && apiKey && startIndexRaw !== null) {
    const startIndex = parseInt(startIndexRaw, 10) || 0;
    setTimeout(async () => {
      await startSearch();
      if (queue && queue.length > startIndex) {
        // Clean URL so back button returns to search page (not auto-play again)
        history.replaceState(null, '', location.pathname);
        openPlayer(startIndex);
      }
    }, 400);
  }
  // If no startIndex → user hit "搜尋" in popup, just pre-fill the form
  // and let them browse / click search themselves on this page if they want
})();
</script>

<script>
/* ══ ACTION MENU ══ */
let currentMenuItem = null;
let currentMenuTriggerIndex = null;

function openSidebarMenu(event, index) {
  event.stopPropagation();
  event.preventDefault();

  const menu = document.getElementById('actionMenu');

  // If menu is already open for THIS same item → close it (toggle behavior)
  if (menu.style.display === 'block' && currentMenuTriggerIndex === index) {
    closeMenu();
    return;
  }

  const item = queue[index];
  if (!item) return;
  currentMenuItem = item;
  currentMenuTriggerIndex = index;

  const favLabel = isFavorite(item.id.videoId) ? '☆ 取消收藏' : '★ 收藏';
  const favAction = isFavorite(item.id.videoId) ? 'unbookmarkCurrent' : 'bookmarkCurrent';
  menu.innerHTML = `
    <button class="action-item" onclick="${favAction}()">
      ${favLabel}
    </button>
    <button class="action-item" onclick="openOnYouTube('${item.id.videoId}')">
      🔗 在 YouTube 開啟
    </button>
    <div class="action-divider"></div>
    <button class="action-item danger" onclick="blockCurrentVideo()">
      🚫 封鎖此影片
    </button>
    <button class="action-item danger" onclick="blockCurrentChannel()">
      🚷 封鎖整個頻道
    </button>
    <div class="action-divider"></div>
    <button class="action-item action-cancel" onclick="closeMenu()">
      取消
    </button>
  `;

  // Position the menu near the button
  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();
  menu.style.display = 'block';

  const menuWidth = 200;
  let left = rect.left - menuWidth - 4;
  if (left < 8) left = rect.right + 4;
  let top = rect.top;

  setTimeout(() => {
    const menuRect = menu.getBoundingClientRect();
    if (top + menuRect.height > window.innerHeight - 8) {
      top = window.innerHeight - menuRect.height - 8;
    }
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }, 0);
}

function closeMenu() {
  document.getElementById('actionMenu').style.display = 'none';
  currentMenuItem = null;
  currentMenuTriggerIndex = null;
}

document.addEventListener('click', e => {
  const menu = document.getElementById('actionMenu');
  if (menu.style.display === 'block' && !menu.contains(e.target) && !e.target.classList.contains('sid-menu-btn')) {
    closeMenu();
  }
});

function blockCurrentVideo() {
  if (!currentMenuItem) return;
  blockVideo(currentMenuItem.id.videoId, currentMenuItem.snippet.title);
  closeMenu();
}

function blockCurrentChannel() {
  if (!currentMenuItem) return;
  blockChannel(currentMenuItem.snippet.channelId, currentMenuItem.snippet.channelTitle);
  closeMenu();
}

function bookmarkCurrent() {
  if (!currentMenuItem) return;
  addToFavorites(currentMenuItem);
  closeMenu();
}

function unbookmarkCurrent() {
  if (!currentMenuItem) return;
  removeFromFavorites(currentMenuItem.id.videoId);
  showToast('♡ 已從最愛移除');
  closeMenu();
}

function openOnYouTube(videoId) {
  window.open('https://www.youtube.com/watch?v=' + videoId, '_blank');
  closeMenu();
}

/* ══ TOAST ══ */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ══ BLOCKLIST MANAGER ══ */
let activeBlocklistTab = 'videos';

function openBlocklistManager() {
  activeBlocklistTab = 'videos';
  document.querySelectorAll('.modal-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === 'videos')
  );
  document.getElementById('blocklistModal').classList.add('show');
  renderBlocklistManager();
}

function closeBlocklistManager() {
  document.getElementById('blocklistModal').classList.remove('show');
}

function switchBlocklistTab(tab) {
  activeBlocklistTab = tab;
  document.querySelectorAll('.modal-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === tab)
  );
  renderBlocklistManager();
}

function renderBlocklistManager() {
  const body = document.getElementById('blocklistBody');

  if (activeBlocklistTab === 'videos') {
    const ids = [...blockedVideos];
    if (ids.length === 0) {
      body.innerHTML = '<div class="blocklist-empty">// 沒有封鎖任何影片</div>';
      return;
    }
    body.innerHTML = ids.map(id => `
      <div class="block-item" data-id="${id}">
        <img class="block-thumb" src="https://i.ytimg.com/vi/${id}/default.jpg" onerror="this.style.opacity=0.3" />
        <div class="block-info">
          <div class="block-title">影片 ID：${id}</div>
          <div class="block-sub">點縮圖在 YouTube 確認</div>
        </div>
        <button class="unblock-btn" onclick="unblockVideo('${id}')">解封</button>
      </div>
    `).join('');
    // Make thumbnails clickable
    body.querySelectorAll('.block-thumb').forEach(img => {
      img.style.cursor = 'pointer';
      img.addEventListener('click', () => {
        const id = img.closest('.block-item').dataset.id;
        window.open('https://www.youtube.com/watch?v=' + id, '_blank');
      });
    });
  } else {
    const ids = [...blockedChannels];
    if (ids.length === 0) {
      body.innerHTML = '<div class="blocklist-empty">// 沒有封鎖任何頻道</div>';
      return;
    }
    body.innerHTML = ids.map(id => `
      <div class="block-item">
        <div class="block-thumb" style="display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.5-8 8-8s8 3.5 8 8"/>
          </svg>
        </div>
        <div class="block-info">
          <div class="block-title">${esc(blockedChannelNames[id] || '未知頻道')}</div>
          <div class="block-sub">${id}</div>
        </div>
        <button class="unblock-btn" onclick="unblockChannel('${id}')">解封</button>
      </div>
    `).join('');
  }
}

function clearBlocklist() {
  if (!confirm('確定要清空所有封鎖紀錄嗎？這個動作無法復原。')) return;
  blockedVideos.clear();
  blockedChannels.clear();
  blockedChannelNames = {};
  saveBlocklist();
  renderBlocklistManager();
  showToast('已清空黑名單');
}

/* ══ FAVORITES MANAGER ══ */
function openFavoritesManager() {
  document.getElementById('favoritesModal').classList.add('show');
  renderFavoritesManager();
}

function closeFavoritesManager() {
  document.getElementById('favoritesModal').classList.remove('show');
}

function renderFavoritesManager() {
  const body = document.getElementById('favoritesBody');
  if (favorites.length === 0) {
    body.innerHTML = '<div class="blocklist-empty">// 還沒有最愛 — 在播放清單點 ⋯ 加入</div>';
    return;
  }
  body.innerHTML = favorites.map((f, i) => `
    <div class="block-item">
      <img class="block-thumb" src="${f.thumbnail || ''}" onerror="this.style.opacity=0.3" style="cursor:pointer" data-vid="${f.videoId}" />
      <div class="block-info" style="cursor:pointer" data-play-idx="${i}">
        <div class="block-title">${esc(f.title)}</div>
        <div class="block-sub">${esc(f.channelTitle || '')}</div>
      </div>
      <button class="unblock-btn" onclick="playFavorite(${i})" style="border-color:rgba(255,45,45,0.4);color:var(--red);">▶ 播放</button>
      <button class="unblock-btn" onclick="removeFromFavorites('${escAttr(f.videoId)}')">移除</button>
    </div>
  `).join('');

  // Click thumb → open in YouTube
  body.querySelectorAll('.block-thumb').forEach(img => {
    img.addEventListener('click', () => {
      window.open('https://www.youtube.com/watch?v=' + img.dataset.vid, '_blank');
    });
  });

  // Click info → play
  body.querySelectorAll('[data-play-idx]').forEach(el => {
    el.addEventListener('click', () => playFavorite(parseInt(el.dataset.playIdx)));
  });
}

function playFavorite(index) {
  const f = favorites[index];
  if (!f) return;

  // Build queue with all favorites starting from this one
  const ordered = [...favorites.slice(index), ...favorites.slice(0, index)];
  queue = ordered.map(fav => ({
    id: { videoId: fav.videoId },
    snippet: {
      title: fav.title,
      channelTitle: fav.channelTitle,
      channelId: fav.channelId,
      thumbnails: { default: { url: fav.thumbnail }, medium: { url: fav.thumbnail } }
    }
  }));
  playedIds = new Set();
  nextPageToken = null;
  discoverPhase = 0;
  activeTags = ['★ 我的收藏'];
  renderActiveTags();

  closeFavoritesManager();

  // If already in player, just load this video
  if (document.getElementById('playerLayout').classList.contains('active')) {
    currentIndex = 0;
    renderSidebar();
    loadVideo(0);
  } else {
    openPlayer(0);
  }
}

function playAllFavorites() {
  if (favorites.length === 0) {
    showToast('最愛清單是空的');
    return;
  }
  playFavorite(0);
}

function clearFavorites() {
  if (!confirm('確定要清空所有最愛嗎？這個動作無法復原。')) return;
  favorites = [];
  saveFavorites();
  renderFavoritesManager();
  showToast('已清空最愛');
}

function exportFavorites() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    favorites
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `music-radar-favorites-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出最愛');
}

function importFavorites(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const list = data.favorites || [];
      let added = 0;
      list.forEach(item => {
        if (!isFavorite(item.videoId)) {
          favorites.unshift(item);
          added++;
        }
      });
      if (favorites.length > 500) favorites = favorites.slice(0, 500);
      saveFavorites();
      renderFavoritesManager();
      showToast(`匯入完成，新增 ${added} 首`);
    } catch(err) {
      showToast('匯入失敗：檔案格式錯誤');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ══ EXPORT / IMPORT ══ */
function exportBlocklist() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    blockedVideos: [...blockedVideos],
    blockedChannels: [...blockedChannels],
    blockedChannelNames
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `music-radar-blocklist-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出黑名單');
}

function importBlocklist(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      let added = 0;
      (data.blockedVideos || []).forEach(id => {
        if (!blockedVideos.has(id)) { blockedVideos.add(id); added++; }
      });
      (data.blockedChannels || []).forEach(id => {
        if (!blockedChannels.has(id)) { blockedChannels.add(id); added++; }
      });
      Object.assign(blockedChannelNames, data.blockedChannelNames || {});
      saveBlocklist();
      renderBlocklistManager();
      showToast(`匯入完成，新增 ${added} 筆`);
    } catch(err) {
      showToast('匯入失敗：檔案格式錯誤');
    }
  };
  reader.readAsText(file);
  event.target.value = '';  // reset for re-import
}

/* ── CLOSE MODAL ON OVERLAY CLICK ── */
document.getElementById('blocklistModal').addEventListener('click', e => {
  if (e.target.id === 'blocklistModal') closeBlocklistManager();
});
document.getElementById('favoritesModal').addEventListener('click', e => {
  if (e.target.id === 'favoritesModal') closeFavoritesManager();
});

/* ══ MOBILE PLAYER ══ */
function isMobile() {
  return window.innerWidth <= 768;
}

/* ── Mobile Toolbar state sync ── */
function syncMobileToolbar() {
  if (!isMobile()) return;

  // AUTO button
  const mobAuto = document.getElementById('mobAutoBtn');
  if (mobAuto) mobAuto.classList.toggle('on-red', autoplay);

  // LOOP button
  const mobLoop = document.getElementById('mobLoopBtn');
  const mobLoopLabel = document.getElementById('mobLoopLabel');
  if (mobLoop) {
    mobLoop.classList.toggle('on-red', loopMode !== 'off');
    if (mobLoopLabel) {
      mobLoopLabel.textContent = loopMode === 'one' ? '單曲' : loopMode === 'all' ? '全部' : '循環';
    }
  }

  // SHUFFLE button
  const mobShuffle = document.getElementById('mobShuffleBtn');
  if (mobShuffle) mobShuffle.classList.toggle('on-red', shuffle);
}

/* ── Mobile Inline Playlist (below video) ── */
function syncMobileInlineList() {
  const inlineList = document.getElementById('mobileInlineList');
  if (!inlineList) return;
  inlineList.innerHTML = queue.map((item, i) => sidebarItemHTML(item, i)).join('');
  // Attach click handlers
  inlineList.querySelectorAll('.sidebar-item').forEach((el, i) => {
    el.onclick = () => loadVideo(i);
  });
  inlineList.querySelectorAll('.sid-menu-btn').forEach((el, i) => {
    el.onclick = (e) => { e.stopPropagation(); openSidebarMenu(e, i); };
  });
}

function updateMobileInlineActive() {
  const inlineList = document.getElementById('mobileInlineList');
  if (!inlineList) return;
  inlineList.querySelectorAll('.sidebar-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIndex);
    el.classList.toggle('played', playedIds.has(queue[i]?.id?.videoId) && i !== currentIndex);
  });
  // Scroll active item into view
  const active = inlineList.querySelector('.sidebar-item.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ── Sync mobile playlist sheet content ── */
function syncMobilePlaylist() {
  const mobileList = document.getElementById('mobileSidebarList');
  const desktopList = document.getElementById('sidebarList');
  if (!mobileList || !desktopList) return;
  // Clone desktop sidebar content into mobile sheet
  mobileList.innerHTML = desktopList.innerHTML;
  // Re-attach click handlers on cloned items
  mobileList.querySelectorAll('.sidebar-item').forEach((el, i) => {
    el.onclick = () => { loadVideo(i); closeMobilePlaylist(); };
  });
  mobileList.querySelectorAll('.sid-menu-btn').forEach((el, i) => {
    el.onclick = (e) => { e.stopPropagation(); openSidebarMenu(e, i); };
  });
}

function updateMobileSidebarActive() {
  const mobileList = document.getElementById('mobileSidebarList');
  if (!mobileList) return;
  mobileList.querySelectorAll('.sidebar-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIndex);
    el.classList.toggle('played', playedIds.has(queue[i]?.id?.videoId) && i !== currentIndex);
  });
}

/* ── Mobile Search ── */
function openMobileSearch() {
  const overlay = document.getElementById('mobileSearchOverlay');
  if (!overlay) return;
  overlay.classList.add('show');
  const input = document.getElementById('mobileSearchInput');
  if (input) {
    input.value = '';
    setTimeout(() => input.focus(), 100);
  }
  setupMobileSearch();
}

function closeMobileSearch() {
  const overlay = document.getElementById('mobileSearchOverlay');
  if (overlay) overlay.classList.remove('show');
  const dropdown = document.getElementById('mobileSearchDropdown');
  if (dropdown) dropdown.classList.remove('show');
}

function executeMobileSearch() {
  const input = document.getElementById('mobileSearchInput');
  const val = input?.value.trim();
  if (!val) return;
  runMobileSearch(val);
}

async function runMobileSearch(tag) {
  const input = document.getElementById('mobileSearchInput');
  const dropdown = document.getElementById('mobileSearchDropdown');
  const goBtn = document.getElementById('mobileSearchGo');

  if (!tag) return;

  // Set global apiKey so loadMoreVideos works after switching
  apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('yt_radar_key');
  searchOrder = document.getElementById('orderType')?.value || 'relevance';
  if (!apiKey) { showToast('請先填入 API Key'); return; }

  // Show loading
  if (goBtn) goBtn.disabled = true;
  dropdown.innerHTML = '<div class="qs-results-header"><span class="loading-dot">搜尋中</span></div>';
  dropdown.classList.add('show');

  try {
    const params = new URLSearchParams({
      part: 'snippet', q: tag + ' music',
      type: 'video', order: 'relevance',
      maxResults: 15, videoCategoryId: '10',
      videoEmbeddable: 'true', key: apiKey
    });
    const res = await fetch('https://www.googleapis.com/youtube/v3/search?' + params);
    const data = await res.json();

    if (data.error || !data.items?.length) {
      dropdown.innerHTML = '<div class="qs-results-header">// 找不到結果</div>';
      if (goBtn) goBtn.disabled = false;
      return;
    }

    const items = filterMusicItems(data.items);
    if (items.length === 0) {
      dropdown.innerHTML = '<div class="qs-results-header">// 結果都被過濾掉了</div>';
      if (goBtn) goBtn.disabled = false;
      return;
    }

    // Save to history
    saveMemory(tag);
    addToSearchHistory(tag);

    // Show results in dropdown
    dropdown.innerHTML =
      `<div class="qs-results-header">// ${items.length} 首 · 點選立即換台</div>` +
      items.map((item, i) => {
        const thumb = item.snippet.thumbnails?.default?.url || '';
        return `
          <div class="qs-result-item autocomplete-item" data-index="${i}">
            ${thumb ? `<img class="qs-thumb" src="${thumb}" alt="" loading="lazy">` : '<div class="qs-thumb-ph"></div>'}
            <div class="qs-info">
              <div class="qs-title">${esc(item.snippet.title)}</div>
              <div class="qs-ch">${esc(item.snippet.channelTitle || '')}</div>
            </div>
          </div>
        `;
      }).join('');
    dropdown.classList.add('show');

    // Click handler — replace queue and play
    dropdown.querySelectorAll('.qs-result-item').forEach((el, i) => {
      el.addEventListener('click', () => {
        const reordered = [...items.slice(i), ...items.slice(0, i)];
        queue = reordered;
        playedIds = new Set();
        nextPageToken = null;
        discoverPhase = 0;
        currentIndex = 0;
        renderSidebar();
        loadVideo(0);
        closeMobileSearch();
        showToast(`已換台：${decodeHTML(items[i].snippet.title).slice(0, 30)}`);
      });
    });

  } catch(e) {
    dropdown.innerHTML = `<div class="qs-results-header">// 錯誤：${esc(e.message)}</div>`;
  }
  if (goBtn) goBtn.disabled = false;
}

let mobileSearchSetup = false;
function setupMobileSearch() {
  if (mobileSearchSetup) return;
  mobileSearchSetup = true;

  const input = document.getElementById('mobileSearchInput');
  const dropdown = document.getElementById('mobileSearchDropdown');
  if (!input) return;

  input.addEventListener('input', () => {
    const val = input.value.trim();
    if (!val) { dropdown.classList.remove('show'); return; }
    const lower = val.toLowerCase();
    const suggestions = [
      ...(JSON.parse(localStorage.getItem('yt_radar_search_history') || '[]'))
        .filter(h => h.text.toLowerCase().includes(lower)).slice(0, 5),
      ...memoryBank.filter(t => t.toLowerCase().includes(lower)).slice(0, 3)
        .map(t => ({ text: t }))
    ].slice(0, 6);

    if (suggestions.length === 0) { dropdown.classList.remove('show'); return; }
    dropdown.innerHTML = suggestions.map((s, i) =>
      `<div class="autocomplete-item" data-index="${i}" data-text="${escAttr(s.text)}">${esc(s.text)}</div>`
    ).join('');
    dropdown.classList.add('show');
    dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('click', () => {
        input.value = el.dataset.text;
        dropdown.classList.remove('show');
      });
    });
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = input.value.trim();
      if (!val) return;
      runMobileSearch(val);
    } else if (e.key === 'Escape') {
      closeMobileSearch();
    }
  });
}

/* ── Mobile Playlist Sheet ── */
function openMobilePlaylist() {
  syncMobilePlaylist();
  updateMobileSidebarActive();
  document.getElementById('mobilePlaylistSheet')?.classList.add('show');
  document.getElementById('mobileSheetOverlay')?.classList.add('show');
}

function closeMobilePlaylist() {
  document.getElementById('mobilePlaylistSheet')?.classList.remove('show');
  document.getElementById('mobileSheetOverlay')?.classList.remove('show');
}

/* ── Patch toggleAutoplay / toggleLoop / toggleShuffle to also sync mobile toolbar ── */
const _origToggleAutoplay = toggleAutoplay;
toggleAutoplay = function() { _origToggleAutoplay(); syncMobileToolbar(); };

const _origToggleLoop = toggleLoop;
toggleLoop = function() { _origToggleLoop(); syncMobileToolbar(); };

const _origToggleShuffle = toggleShuffle;
toggleShuffle = function() { _origToggleShuffle(); syncMobileToolbar(); };

/* ── Init mobile on player open ── */
const _origOpenPlayer = openPlayer;
openPlayer = function(index) {
  _origOpenPlayer(index);
  if (isMobile()) {
    syncMobileToolbar();
    syncMobilePlaylist();
    syncMobileInlineList();
    updateMobileInlineActive();
  }
};

/* ── ESC TO CLOSE ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeBlocklistManager();
    closeFavoritesManager();
    closeResultsDrawer();
    closeMenu();
  }
});
